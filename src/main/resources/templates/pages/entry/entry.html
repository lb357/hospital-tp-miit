<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Запись в медицинской карте</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script type="module" th:src="@{/js/entry.js}" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>

<h2>Запись в медицинской карте</h2>

<form id="entryForm" autocomplete="off">
    <textarea
            id="entryContent"
            rows="12"
            placeholder="Введите содержание записи..."
            required
    ></textarea>

    <button type="submit" id="saveButton">
        Сохранить
    </button>
</form>


<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
