<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header">
    <h1>БОЛЬНИЦА</h1>
    <div th:if="${@cookieTokenResolver.getSession() != null}">
        <a th:href="@{/profile}">Профиль</a>
        <a th:href="@{/appointments}">Приёмы</a>
        <a th:href="@{/record}" th:if="${@accountService.getPatient(@cookieTokenResolver.getSession())!=null}">Медкарта</a>

        <button type="button" id="logoutButton">Выход из системы</button>
    </div>
    <a th:unless="${@cookieTokenResolver.getSession() != null}" th:href="@{/login}">Вход в систему</a>
    <hr>

    <script type="module">
        import { protocol, request } from '/js/protocol.js';

        document.getElementById('logoutButton')?.addEventListener('click', async () => {
            const result = await request(
                () => protocol.logout(),
                (message) => alert(message)
            );

            if (result !== null) {
                window.location.href = '/login';
            }
        });
    </script>
</header>
</body>
</html>
