spring:
  application:
    name: hospital-tp-miit

  datasource:
    url: jdbc:sqlite:hospital.db
    driver-class-name: org.sqlite.JDBC

  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  web:
    resources:
      cache:
        period: 0
        cachecontrol:
          no-store: true

  thymeleaf:
    cache: false

hospital:
  init-admin-password: Example_1